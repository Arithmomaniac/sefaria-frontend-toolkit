name: Validate toolkit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validation:
    name: validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm setup:agent
      - run: pnpm check
        env:
          SITE_SCREENSHOT_DIR: .artifacts/site
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ runner.os }}
          path: |
            .artifacts/check/result.json
            .artifacts/setup/result.json
            .artifacts/site/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
