name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    name: validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm setup:agent
      - run: pnpm check
        env:
          SITE_SCREENSHOT_DIR: .artifacts/site
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ runner.os }}
          path: |
            .artifacts/check/result.json
            .artifacts/setup/result.json
            .artifacts/site/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  check:
    name: check
    if: ${{ always() }}
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation platform
        run: |
          if [ "${{ needs.validation.result }}" != "success" ]; then
            echo "Validation result: ${{ needs.validation.result }}"
            exit 1
          fi

  publish:
    name: publish private prerelease
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH_VERSION: 0.0.0-alpha.${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@arithmomaniac"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/package-publication.mjs stage --version "$PUBLISH_VERSION"
      - name: Require the current main head
        run: |
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - run: node scripts/package-publication.mjs preflight
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: pnpm publish .artifacts/publish/client --tag alpha --access restricted --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: pnpm publish .artifacts/publish/text-transform --tag alpha --access restricted --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: pnpm publish .artifacts/publish/web-components --tag alpha --access restricted --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: node scripts/package-publication.mjs verify --version "$PUBLISH_VERSION"
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
