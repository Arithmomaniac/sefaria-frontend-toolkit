name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    uses: ./.github/workflows/validate-toolkit.yml

  check:
    name: check
    if: ${{ always() }}
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation platform
        run: |
          if [ "${{ needs.validation.result }}" != "success" ]; then
            echo "Validation result: ${{ needs.validation.result }}"
            exit 1
          fi

  publish:
    name: publish public prerelease
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SEFARIA_PACKAGES_ENABLED == 'true' }}
    needs: check
    uses: ./.github/workflows/publish-packages.yml
    with:
      bootstrap: false
    permissions:
      contents: read
      packages: write

  script-source:
    name: archive browser script
    timeout-minutes: 30
    needs: publish
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SEFARIA_PACKAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SCRIPT_VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm setup:agent
      - run: pnpm build
      - run: pnpm build:script-source
      - run: pnpm test:script-source dist/script-source
      - run: node scripts/script-source-release.mjs publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
