<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sefaria reader workspace</title>
  </head>
  <body>
    <div id="reader-site">
      <header id="site-header">
        <div class="demo-heading">
          <strong>Multi-pane website demo</strong>
          <a href="./controlled.html">Open the controlled component demo</a>
        </div>
        <form id="reader-form">
          <label>
            Reference
            <input name="tref" value="Micah 6:8" required />
          </label>
          <button type="submit">Start live demo</button>
          <label>
            Hebrew marks
            <select id="vocalization-mode">
              <option value="taamim_and_nikkud">Cantillation and vowels</option>
              <option value="nikkud">Vowels only</option>
              <option value="none">No marks</option>
            </select>
          </label>
        </form>
        <nav id="pane-path" aria-label="Open reader panes"></nav>
        <p id="status" role="status">
          Click Start live demo to load this reference from Sefaria. No live
          data has been loaded yet.
        </p>
        <p id="host-error" role="alert" hidden></p>
      </header>
      <main id="workspace" aria-label="Reader workspace"></main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
