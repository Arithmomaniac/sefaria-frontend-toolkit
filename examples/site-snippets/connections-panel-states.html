<script
  type="module"
  src="https://arithmomaniac.github.io/sefaria-frontend-toolkit/cdn/alpha/sefaria-elements.js"
></script>
<sefaria-connections-panel sref="Micah 6:8"></sefaria-connections-panel>
<sefaria-connections-panel sref="Not a book 3:4"></sefaria-connections-panel>
<sefaria-connections-panel></sefaria-connections-panel>
<button type="button" id="check">Show each status</button>
<pre id="log"></pre>
<script type="module">
  const log = document.querySelector("#log");
  document.addEventListener("sefaria-connections-panel-error", (event) => {
    log.textContent += `Error for ${event.detail.sref}: ${event.detail.error.message}\n`;
  });
  document.querySelector("#check").addEventListener("click", () => {
    for (const element of document.querySelectorAll(
      "sefaria-connections-panel",
    )) {
      log.textContent += `"${element.sref}" is ${element.status}\n`;
    }
  });
</script>
