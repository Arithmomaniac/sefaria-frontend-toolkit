<script
  type="module"
  src="https://arithmomaniac.github.io/sefaria-frontend-toolkit/cdn/alpha/sefaria-elements.js"
></script>
<sefaria-ref-label sref="Micah 6:8"></sefaria-ref-label>
<sefaria-ref-label sref="Not a book 3:4"></sefaria-ref-label>
<sefaria-ref-label></sefaria-ref-label>
<button type="button" id="check">Show each status</button>
<pre id="log"></pre>
<script type="module">
  const log = document.querySelector("#log");
  document.addEventListener("sefaria-ref-label-error", (event) => {
    log.textContent += `Error for ${event.detail.sref}: ${event.detail.error.message}\n`;
  });
  document.querySelector("#check").addEventListener("click", () => {
    for (const label of document.querySelectorAll("sefaria-ref-label")) {
      log.textContent += `"${label.sref}" is ${label.status}\n`;
    }
  });
</script>
